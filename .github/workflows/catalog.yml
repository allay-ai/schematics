name: Catalog

# Every change to the catalog: check it, cut each build to its blocks, describe new builds, and rebuild index.json.
# Hourly: pick up what a pending batch of descriptions brought.
on:
  push:
    branches: [master]
    paths: ["catalog/**", "tools/**", "tests/**", ".github/workflows/catalog.yml"]
  pull_request:
    paths: ["catalog/**", "tools/**", "tests/**"]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python3 -I -m unittest discover -s tests
      # A pull request brings sources and meta.json; the build files come from CI after the merge.
      - run: python3 -I tools/build.py --check || echo "::notice::build.schem and index.json follow on master"

  catalog:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python3 -I -m unittest discover -s tests
      - run: python3 -I tools/build.py
      - name: Describe
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then echo "::warning::no OPENROUTER_API_KEY: new builds stay without descriptions"; exit 0; fi
          if [ "${{ github.event_name }}" = "schedule" ]; then python3 -I tools/describe.py --collect; else python3 -I tools/describe.py; fi
      - run: python3 -I tools/build.py
      - name: Commit
        run: |
          git config user.name "allay-catalog[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A catalog index.json .describe
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "Rebuild the catalog"
          git push
